[project]
name = "mini-opencode-mvp"
version = "0.1.0"
description = "Minimal coding-agent harness for small local language models"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "tree-sitter>=0.23,<1",
  "tree-sitter-go>=0.23,<1",
]

[project.scripts]
mini-agent = "mini_agent.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["mini_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
